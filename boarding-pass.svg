
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336" role="img" aria-labelledby="title desc">

  <title id="title">Boarding pass: Loris Sagristano</title>
  <desc id="desc">A boarding pass representing the journey from Project Management to Data Analytics and Machine Learning.</desc>

  <defs>
    <clipPath id="shape">
      <path d="M16,0 H508 A12,12 0 0 0 532,0 H704 A16,16 0 0 1 720,16 V320 A16,16 0 0 1 704,336 H532 A12,12 0 0 0 508,336 H16 A16,16 0 0 1 0,320 V16 A16,16 0 0 1 16,0 Z"/>
    </clipPath>
  </defs>

  <style>
    :root { color-scheme: light dark; }

    .paper { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .band { fill: #0969da; }
    .accent { fill: #0969da; }
    .rule { stroke: #d0d7de; }
    .flight { stroke: #8c959f; }
    .bars { fill: #1f2328; }
    .ink { fill: #1f2328; }
    .muted { fill: #656d76; }
    .ring { fill: none; stroke: #8c959f; stroke-width: 1.5; }

    @media (prefers-color-scheme: dark) {
      .paper { fill: #161b22; stroke: #30363d; }
      .band { fill: #1f6feb; }
      .accent { fill: #58a6ff; }
      .rule { stroke: #30363d; }
      .flight { stroke: #6e7681; }
      .bars { fill: #e6edf3; }
      .ink { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .ring { stroke: #6e7681; }
    }

    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .label {
      font-size: 10px;
      letter-spacing: 1.6px;
    }

    .white { fill: #ffffff; }

    .dash {
      stroke-dasharray: 5 6;
      animation: flow 1.2s linear infinite;
    }

    .fly {
      animation: fly 5s ease-in-out infinite;
    }

    @keyframes flow {
      to { stroke-dashoffset: -22; }
    }

    @keyframes fly {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translate(300px, 0); opacity: 0; }
    }
  </style>

  <!-- Ticket shape -->
  <path class="paper" d="M16,0 H508 A12,12 0 0 0 532,0 H704 A16,16 0 0 1 720,16 V320 A16,16 0 0 1 704,336 H532 A12,12 0 0 0 508,336 H16 A16,16 0 0 1 0,320 V16 A16,16 0 0 1 16,0 Z"/>

  <g clip-path="url(#shape)">
    <rect class="band" x="0" y="0" width="720" height="52"/>
  </g>

  <line class="rule" x1="520" y1="16" x2="520" y2="320" stroke-dasharray="4 5"/>

  <!-- Header -->
  <text class="mono white label" x="28" y="31" style="font-size:12px;letter-spacing:2.2px;font-weight:700">BUILTBYLORIS</text>
  <text class="mono white label" x="496" y="31" text-anchor="end" style="font-size:12px;letter-spacing:2.2px">BOARDING PASS</text>
  <text class="mono white label" x="544" y="31" style="font-size:12px;letter-spacing:2.2px">ADMIT ONE</text>

  <!-- Passenger -->
  <text class="mono muted label" x="28" y="82">PASSENGER</text>
  <text class="mono ink" x="28" y="110" style="font-size:26px;font-weight:700;letter-spacing:.5px">SAGRISTANO LORIS</text>

  <!-- Journey -->
  <text class="mono accent" x="28" y="168" style="font-size:44px;font-weight:700">PM</text>
  <text class="mono accent" x="496" y="168" text-anchor="end" style="font-size:44px;font-weight:700">ML</text>

  <circle class="ring" cx="104" cy="150" r="3.5"/>
  <circle class="ring" cx="424" cy="150" r="3.5"/>

  <line class="flight dash" x1="112" y1="150" x2="416" y2="150" stroke-width="1.5"/>

  <g transform="translate(118 150)">
    <g class="fly">
      <path class="accent" d="M14 0 L6 -2.5 L-2 -11 L-5 -11 L-1 -2 L-9 -1.5 L-12 -5 L-14.5 -5 L-12.5 0 L-14.5 5 L-12 5 L-9 1.5 L-1 2 L-5 11 L-2 11 L6 2.5 Z"/>
    </g>
  </g>

  <text class="mono muted label" x="28" y="190">PROJECT MANAGEMENT</text>
  <text class="mono muted label" x="496" y="190" text-anchor="end">DATA &amp; MACHINE LEARNING</text>

  <line class="rule" x1="28" y1="208" x2="492" y2="208" stroke-dasharray="4 5"/>

  <!-- Personal information -->
  <text class="mono muted label" x="28" y="232">OCCUPATION</text>
  <text class="ink" x="28" y="252" style="font-size:14px;font-weight:600">Student · Project Management</text>

  <text class="mono muted label" x="262" y="232">PASSION</text>
  <text class="ink" x="262" y="252" style="font-size:14px;font-weight:600">Data analysis · Machine learning</text>

  <!-- Right ticket -->
  <text class="mono muted label" x="544" y="100">ABOUT ME</text>
  <text class="mono accent" x="544" y="132" style="font-size:19px;font-weight:700">BUILTBYLORIS</text>

  <line class="rule" x1="544" y1="154" x2="692" y2="154" stroke-dasharray="3 4"/>


  <!-- Barcode -->
  <g class="bars">
    <rect x="544.0" y="236" width="1.5" height="58"/>
    <rect x="548.5" y="236" width="1.5" height="58"/>
    <rect x="552.0" y="236" width="5" height="58"/>
    <rect x="560.0" y="236" width="1.5" height="58"/>
    <rect x="563.0" y="236" width="3.5" height="58"/>
    <rect x="568.0" y="236" width="5" height="58"/>
    <rect x="576.0" y="236" width="1.5" height="58"/>
    <rect x="580.5" y="236" width="3.5" height="58"/>
    <rect x="585.5" y="236" width="3.5" height="58"/>
    <rect x="592.0" y="236" width="1.5" height="58"/>
    <rect x="596.5" y="236" width="1.5" height="58"/>
    <rect x="601.0" y="236" width="1.5" height="58"/>
    <rect x="604.0" y="236" width="1.5" height="58"/>
    <rect x="607.0" y="236" width="5" height="58"/>
    <rect x="614.0" y="236" width="3.5" height="58"/>
    <rect x="619.5" y="236" width="1.5" height="58"/>
    <rect x="624.0" y="236" width="1.5" height="58"/>
    <rect x="627.0" y="236" width="2.5" height="58"/>
    <rect x="632.5" y="236" width="5" height="58"/>
    <rect x="639.0" y="236" width="5" height="58"/>
    <rect x="645.5" y="236" width="1.5" height="58"/>
    <rect x="649.0" y="236" width="5" height="58"/>
    <rect x="657.0" y="236" width="5" height="58"/>
    <rect x="664.0" y="236" width="2.5" height="58"/>
    <rect x="669.5" y="236" width="3.5" height="58"/>
    <rect x="675.0" y="236" width="1.5" height="58"/>
    <rect x="678.0" y="236" width="2.5" height="58"/>
    <rect x="682.0" y="236" width="5" height="58"/>
    <rect x="689.0" y="236" width="3.5" height="58"/>
  </g>

  <text class="mono muted" x="544" y="318" style="font-size:9px;letter-spacing:1.5px">LX-84K9-27Q</text>

</svg>
